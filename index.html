:root{--bg:#0E1116;--surface:#161A21;--surface2:#1D222B;--line:rgba(255,255,255,0.08);--line2:rgba(255,255,255,0.15);--text:#E6E8EC;--sub:#A3AAB6;--dim:#7A828F;--acc:#5B9BF0;--ok:#4CC38A;--warn:#E0A341;--bad:#E5675F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;background:var(--bg);overflow-x:hidden;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;color:inherit}
input,textarea{font-family:inherit}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 124px) 14px calc(env(safe-area-inset-bottom) + 96px);display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.lbl{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.01em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sb{justify-content:space-between}
.h1{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:28px}
.h2{font-size:17px;font-weight:650;line-height:22px}
.sec{font-size:13px;font-weight:600;color:var(--dim);margin:10px 2px -2px;text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--sub);font-size:14px}
.dim{color:var(--dim);font-size:13px}
.togl{border:1px solid var(--line2);background:transparent;color:var(--sub);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.togl.sm{padding:5px 10px;font-size:13px;min-height:34px}
.togl .dot{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--dim);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;line-height:1}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:10px;background:var(--surface2);border:1px solid var(--line)}
.seg button{border:none;border-radius:8px;padding:7px 12px;font-size:14px;font-weight:500;color:var(--sub);background:transparent;min-height:34px}
.seg button.on{color:var(--text);background:#2E3644;font-weight:600}
.pain{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px;max-width:440px}
.pain button{height:38px;border-radius:8px;border:1px solid var(--line2);background:transparent;color:var(--sub);font-weight:600;font-size:14px;padding:0}
.fld{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:2px 10px}
.fld input{width:64px;background:transparent;border:none;outline:none;color:var(--text);font-size:17px;font-weight:600;padding:7px 0}
.fld.w input{width:80px}
.fld.ro{border-style:dashed;background:transparent}
.fld.ro input{color:var(--text)}
.fld span{color:var(--dim);font-size:12px;font-weight:500}
.toast{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 80px);z-index:46;max-width:696px;margin:0 auto;padding:12px 14px;border-radius:12px;background:#232A35;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,0.4)}
.inp{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--text);font-size:16px;outline:none}
input::placeholder,textarea::placeholder{color:#59606C}
input:focus,textarea:focus{border-color:var(--acc)}
.ib{width:26px;height:26px;border-radius:13px;border:1px solid var(--line2);background:transparent;color:var(--dim);font-weight:600;font-size:13px;flex:0 0 auto;padding:0;font-family:Georgia,serif;font-style:italic}
.btn{border:none;border-radius:10px;padding:10px 16px;font-weight:600;color:#fff;background:var(--acc);font-size:15px;min-height:42px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2);font-weight:500}
.btn:disabled{background:var(--surface2);color:var(--dim);border:1px solid var(--line)}
.lnk{border:none;background:transparent;color:var(--acc);font-weight:600;font-size:14px;padding:6px 0;min-height:34px}
.sbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--text);font-size:17px;font-weight:500;padding:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item:last-child{border-bottom:none}
.boxed{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.tick{width:28px;height:28px;border-radius:14px;flex:0 0 auto;border:1.5px solid var(--dim);background:transparent;color:#fff;font-weight:700;font-size:14px;padding:0}
.tag{margin-left:8px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;border:1px solid;vertical-align:1px;white-space:nowrap}
.kv{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:var(--surface2);font-size:13px}
.kv i{width:6px;height:6px;border-radius:3px;display:inline-block}
.stat{flex:1 1 90px;padding:10px 12px;border-radius:12px;background:var(--surface2)}
.stat b{display:block;font-size:19px;font-weight:650;white-space:nowrap}
.stat small{font-size:12px;color:var(--dim)}
.bar{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden}
.bar>div{position:absolute;top:0;bottom:0}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.strip button{position:relative;flex:0 0 44px;padding:6px 0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:2px}
.warn{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:14px;line-height:20px;border:1px solid var(--line);border-left-width:3px;background:var(--surface)}
.warn b{font-size:14px;font-weight:600}
.stepn{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;border:1.5px solid var(--line2);color:var(--dim);flex:0 0 auto}
.sheetbg{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:82%;overflow-y:auto;background:var(--surface);border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:38px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;text-align:center;font-size:11px;color:var(--dim)}
.badge.on{border-color:var(--line2);background:var(--surface2);color:var(--text)}
.badge span{display:block;font-size:20px;margin-bottom:2px}
textarea.inp{width:100%;resize:vertical;font-size:16px;line-height:22px}
.arc{transition:stroke-dashoffset 500ms ease}
.hdr{position:fixed;left:0;right:0;top:0;z-index:40;background:rgba(14,17,22,0.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) 12px 10px}
.hdr-in,.tabs-in{max-width:720px;margin:0 auto}
.hdate{flex:1;min-width:0;background:transparent;border:none;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:0;padding:2px 4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;padding:0 4px}
.kpi{min-width:0}
.kpi .kt{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:5px}
.kpi b{font-size:16px;font-weight:650;white-space:nowrap}
.kpi small{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:0 10px;height:32px;font-size:12px;color:var(--sub);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:4px;display:inline-block}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(18,21,27,0.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:4px 6px calc(env(safe-area-inset-bottom) + 4px)}
.tabs-in{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{position:relative;border:none;background:transparent;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;min-height:52px;border-radius:10px;font-size:11px;font-weight:500}
.tabs button svg{display:block}
.tabs button.on{color:var(--acc)}
.tabs .dotb{position:absolute;top:6px;left:calc(50% + 8px);width:7px;height:7px;border-radius:4px;background:var(--bad)}
.nx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 2px;min-height:54px;border:none;border-bottom:1px solid var(--line);background:transparent;color:var(--text)}
.nx:last-child{border-bottom:none}
.nx small{display:block;color:var(--dim);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:block;padding:0;background:#111}
.mv{border:1px solid var(--line2);background:transparent;color:var(--sub);border-radius:10px;height:38px;padding:0 10px;font-size:13px;font-weight:500}
.qin{padding:0 8px}
.qin input{width:56px;font-size:16px}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1 1 100%;padding-left:38px}
.ctl .sbtn{width:34px;height:34px;font-size:16px}
.ctl .fld{padding:0 8px}
.ctl .fld input{width:46px;font-size:15px;padding:6px 0}
.ctl .mv{height:34px}
.mhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.tin{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--text);font-size:16px;color-scheme:dark;min-height:40px}
.phbtn{border:1px solid var(--line2);background:transparent;color:var(--text);border-radius:10px;min-height:40px;padding:0 12px;font-weight:500;font-size:14px}
.stack{display:flex;flex-direction:column;gap:8px}
.chev{color:var(--dim);font-size:18px;flex:0 0 auto}
@media (prefers-reduced-motion:reduce){.arc{transition:none}}
</style>
</head>

 weigh:{title:"How to weigh in",body:["After the bathroom, before food, same scale every day.","Judge by the 7-day average, not one reading. Water and food swing the scale 1–3 lb. Once a day only.","Waist: tape on bare skin at belly-button level, level all the way round, snug not pressing, after a normal breath out."]},
 mob:{title:"{R} routine",body:["One tap per round: AM (morning) and PM (evening). Yes = you did it, No = you skipped it. No per-exercise tracking.","Your usual stretches and strengthening, as agreed with your doctor. Stop any move that brings on pain."]},
 strava:{title:"From Strava",body:["Turn on From Strava and this session's minutes, distance and active calories come from your Strava activity. You can't type over them while it's on.","Nalam adds each Strava activity to your day in the sync repo. It shows here on the next sync: open the app, or tap the sync pill.","Walks, runs and hikes count toward the morning session; other activity types count toward strength. Rewards and totals use the Strava numbers while it's on.","Until the activity arrives you'll see Waiting for Strava sync. Turn it off to type the numbers yourself."]},
 painday:{title:"Pain today",body:["Your highest pain today, 0–10, anywhere. Log it any time in the evening; you don't have to wait until bed.","You can change it the next morning: go back one day with ‹. It stays editable even after Mark day done.","Any pain (1+) means tomorrow is an easy walk, not a walk-run."]},
 gate:{title:"Walk-run check (the gate rule)",body:["Walk-runs only after a fully pain-free (0) day, including during the stretches. Mild pain (1+) is not pain-free.","Any pain during or after a walk or walk-run = no walk-run next day, easy walk instead.","The ladder never skips or doubles a step, at least 1 day apart. The app moves you to the next step only after one is done. Any pain on a walk-run: stop jogging, walk home, tell your doctor.","Get seen promptly for limping, pain at rest or at night, swelling, warmth, or pain getting worse. Chest pain, fainting, trouble breathing: call 911."]},
 active:{title:"Where to find Active Calories",body:["iPhone Fitness app › Workouts › tap that session › Active Calories.","Not Total Calories (it includes what your body burns at rest) and not the Move ring (whole day).","Leave it blank and the app uses a calculated estimate (from your minutes if you enter them)."]},
 half:{title:"How the reward works",body:["The reward unlocks only when the workout is marked Done (or you enter its Active Calories). Skipped = no reward.","Tiers from workout Active Calories: under 200 = 10 g pumpkin seeds · 200–349 = seeds + 15 g peanuts · 350–500 = seeds + 25 g peanuts · over 500 = that plus carb fuel.","Watches tend to overestimate workout burn, and eating it all back erases the deficit, so the tiers are sized to roughly half. Weigh the reward and eat it with the meal, never as a snack after."]},
 peanut:{title:"The peanut rule",body:["Peanuts and pumpkin seeds only as the workout reward allows. Rest day = none.","Weigh once, put the bag away. Several handfuls of in-shell peanuts (about 60–100 g, roughly 350–600 cal, estimate) were the likely plateau leak.","One in-shell handful ≈ 30 g in shell ≈ 20 g nuts ≈ 120 cal (estimate)."]},
 floor:{title:"The 1,600 floor",body:["Never under 1,600 cal on the day. If the plan lands below, the app adds 50 g cooked chicken, then 2 egg whites, automatically.","The base plate is kept a little under target on purpose; workouts earn the rest."]},
 full:{title:"Fullness tips",body:["500 ml water first.","Protein and veg first, fruit and extras last.","Eat slowly, 25–30 min. Weigh everything."]},
 rem:{title:"{P} with meals",body:["Set in Settings. Through the date you set, the app keeps 2 meals a day and reminds you to take it with each meal."]},
 race:{title:"Race day",body:["Up about 3 h before. Small tested carb breakfast 2–3 h before. Run-walk 4 min jog / 1 min walk from the start.","Pain: walk. Sharp or worsening: stop.","Add your race details in Settings."]},
 carb:{title:"Carb prep",body:["Before a walk-run or heavy upper-body day, add a 2nd date plus 150 g cooked rice or 150 g sweet potato to tonight's meal. The app turns this on automatically when tomorrow is a walk-run and today is pain-free.","Race eve (Sat Nov 14): plate + 250 g rice + 2nd date + 100 g sweet potato, about 1,960 cal (calculated). Nothing new, nothing fried."]},
 extras:{title:"Anything else you ate",body:["Log every bite that isn't on the plate: tap a preset or type it in. Values are estimates from typical food values. Change the amount any time.","Don't know the nutrition? Type just the name (grams or pieces optional). It shows NEEDS ESTIMATE, stays out of the totals, and Nalam estimates it from your synced day. You can type the calories in later.","Extras count in the rings, the eaten totals and the day score. Over target? No make-up cuts tomorrow; just back on plan, never under 1,600."]},
 dur:{title:"Walk length in this phase",body:["Easy walks are 25–30 min in this phase. Under 20 is short but fine.","31–40 min: longer than plan, keep it 25–30. Over 40 min: too long for this phase; tell Nalam and keep tomorrow easy.","Pain after any walk still closes tomorrow's walk-run gate."]},
 omad:{title:"OMAD vs 2 meals",body:["Weekdays: OMAD, one sitting 4–6 PM. Weekends: same plate split into 2 meals, 12–6 PM.","The app warns when you log food outside the window (it records the time you tick an item)."]},
 score:{title:"Checklist, streaks and points",body:["Checklist done = share of today's steps logged: weigh-in, both {r} rounds, the session, the plate eaten, calories inside target, strength, pain today logged.","80%+ = an on-plan day and keeps the streak. {R} streak counts days with both {r} rounds done or partial.","Points: 10 per step, up to 50 for the checklist, +20 calories on target, +20 protein hit, +15 both {r} rounds, −10 for each off-plan extra."]},
 save:{title:"Saving and Nalam",body:["Everything you enter saves on this device the moment you type or tap, per day. Close and reopen: it's still there. Works offline.","With Sync on (⚙), each day goes to your private repo within seconds, and Nalam reads it from there. No copying or pasting needed. Mark day done syncs right away.","Safari and the Home Screen app keep separate storage on iPhone; Sync keeps them and your Mac in step.","Backup: copy summary (More tab) is only for when sync is off or failing."]},
 eatnum:{title:"How the numbers work",body:["Calories and protein at the top and on Today count only what you marked eaten plus the extras you added. Uneaten plan items never count.","Targets: 1,650–1,700 cal on most days (walk-run days 1,700–1,800), protein 150–160 g, and try not to end a day under 1,600 cal.","Today › Details › Planned day shows what the whole plan would add up to. It is a guide, not a total.","All food values are estimates from typical values, cooked weights."]},
 pains:{title:"App problems / fix this",body:["Anything the app can't handle, gets wrong or makes slow: write it here, in your own words. It saves with this day only; a new day starts empty.","Nalam reads it from sync and fixes the app. Once it's fixed, tap Fixed ✓ / clear: the note is archived with the day and the box empties."]}
